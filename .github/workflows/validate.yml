name: Validate WhenScape
on: [push, pull_request, workflow_dispatch]
jobs:
  mac-saver:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test the sundial and weather
        run: scripts/test-saver.sh
      - name: Build the screensaver bundle
        run: scripts/build-saver.sh
      - name: Package the screensaver
        run: ditto -c -k --sequesterRsrc --keepParent build/WhenScape.saver build/WhenScape-saver-macOS.zip
      - name: Verify and smoke-test the packaged bundle
        run: |
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          ditto -x -k build/WhenScape-saver-macOS.zip "$extracted"
          codesign --verify --strict "$extracted/WhenScape.saver"
          cp build/WhenScapePreview "$extracted/WhenScapePreview"
          "$extracted/WhenScapePreview" --smoke --system-size
      - uses: actions/upload-artifact@v6
        with:
          name: WhenScape-saver-macOS
          path: build/WhenScape-saver-macOS.zip
          if-no-files-found: error
      - name: Capture fixed scene previews
        continue-on-error: true
        run: |
          mkdir -p build/saver-previews
          for fixture in clear morning afternoon summer overcast fog rain snow snow-cover twilight moon cloudy-night; do
            build/WhenScapePreview --fixture "$fixture" --capture "build/saver-previews/$fixture.png"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: WhenScape-saver-previews
          path: build/saver-previews/*.png
          if-no-files-found: ignore
