name: Validate WhenScape
on: [push, pull_request, workflow_dispatch]
jobs:
  mac-app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and test native app and scene
        run: bash scripts/build-macos.sh
      - name: Package app
        run: |
          app_path="$(cd build/WhenScape.app && pwd -P)"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" build/WhenScape-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WhenScape-macOS
          path: build/WhenScape-macOS.zip
  mac-saver:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test the sundial and weather
        run: scripts/test-saver.sh
      - name: Build the screensaver bundle
        run: scripts/build-saver.sh
      - name: Smoke-test the installed bundle entry point
        run: build/WhenScapePreview --smoke --system-size
      - name: Package the screensaver
        run: ditto -c -k --sequesterRsrc --keepParent build/WhenScape.saver build/WhenScape-saver-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WhenScape-saver-macOS
          path: build/WhenScape-saver-macOS.zip
          if-no-files-found: error
